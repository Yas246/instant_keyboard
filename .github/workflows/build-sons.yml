name: Build Sons APK

on:
  push:
    branches: [main, wip]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run sounds-core tests
        run: |
          chmod +x gradlew
          ./gradlew :sounds-core:test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}
      - name: Publish error log to repo (diagnostic, removed once green)
        if: failure()
        run: |
          { echo "=== BUILD ERROR TAIL ($(date -u +%FT%TZ)) ==="; tail -n 150 /tmp/build.log; } > ci-error.log
          git config user.name "ci-log"
          git config user.email "ci-log@users.noreply.github.com"
          git add ci-error.log
          git commit -m "ci: build error log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"
      - name: Publish to dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Dernière version de dev"
          files: app/build/outputs/apk/release/*.apk
          make_latest: true
