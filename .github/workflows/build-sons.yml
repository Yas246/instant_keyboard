name: Build Sons APK

on:
  push:
    branches: [main, wip]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run sounds-core tests
        run: |
          chmod +x gradlew
          ./gradlew :sounds-core:test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Compute version
        id: ver
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "tag=v${VN}-${VC}" >> "$GITHUB_OUTPUT"
          echo "apk=ClavierSons_${VN}-${VC}.apk" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/${{ steps.ver.outputs.apk }}"
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Clavier Sons ${{ steps.ver.outputs.tag }}"
          files: app/build/outputs/apk/release/${{ steps.ver.outputs.apk }}
          make_latest: true
